# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Reaktion oder Zustandsänderung?
  en: Reaction or change of state?
description:
  de: Bei einer Zustandsänderung bleibt der Stoff derselbe, bei einer chemischen Reaktion entsteht ein neuer.
  en: In a change of state the substance stays the same; in a chemical reaction a new one is formed.
competencies: [reaktion-oder-zustandsaenderung]
blocks:
  - type: section
    id: warum
    title:
      de: Warum
      en: Why
    blocks:
      - type: text
        text:
          de: |
            Wenn Eis schmilzt, bleibt es Wasser. Wenn Holz verbrennt, bleibt kein Holz übrig. Beides verändert einen Stoff, aber auf ganz verschiedene Weise. Auf dieser Seite lernst du, beides auseinanderzuhalten.
          en: |
            When ice melts, it is still water. When wood burns, no wood is left. Both change a substance, but in very different ways. On this page you learn to tell them apart.
  - type: section
    id: regel
    title:
      de: Regel
      en: Rule
    blocks:
      - type: definition
        term:
          de: Zustandsänderung
          en: Change of state
        explanation:
          de: Bei einer Zustandsänderung wie Schmelzen oder Verdampfen bleibt der Stoff derselbe. Nur der Aggregatzustand ändert sich.
          en: In a change of state such as melting or evaporating the substance stays the same. Only the state of matter changes.
      - type: text
        text:
          de: |
            Stelle dir die Frage: Ist der Stoff danach noch derselbe? Wenn ja, ist es eine Zustandsänderung. Du kannst sie meist umkehren: Wasserdampf wird beim Abkühlen wieder Wasser. Wenn ein neuer Stoff entstanden ist, war es eine chemische Reaktion.
          en: |
            Ask yourself: is the substance still the same afterwards? If so, it is a change of state. You can usually reverse it: water vapour becomes water again when it cools. If a new substance was formed, it was a chemical reaction.
  - type: section
    id: beispiel
    title:
      de: Beispiel
      en: Example
    blocks:
      - type: example
        title:
          de: Kerze brennt
          en: A candle burns
        blocks:
          - type: text
            text:
              de: |
                An einer brennenden Kerze passiert beides. Das Wachs unter der Flamme schmilzt und wird flüssig: Das ist eine Zustandsänderung, es bleibt Wachs. Das verdampfte Wachs verbrennt in der Flamme zu anderen Stoffen, zum Beispiel Kohlenstoffdioxid und Wasserdampf: Das ist eine chemische Reaktion.
              en: |
                Both happen at a burning candle. The wax below the flame melts and becomes liquid: that is a change of state, it stays wax. The evaporated wax burns in the flame to other substances, for example carbon dioxide and water vapour: that is a chemical reaction.
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: multiple-choice
        id: vorgang-art
        text:
          de: Welche dieser Vorgänge sind chemische Reaktionen?
          en: Which of these processes are chemical reactions?
        options:
          - text:
              de: Holz verbrennt.
              en: Wood burns.
            correct: true
            info:
              de: Beim Verbrennen entstehen neue Stoffe, zum Beispiel Kohlenstoffdioxid und Asche. Es ist eine chemische Reaktion.
              en: Burning forms new substances, for example carbon dioxide and ash. It is a chemical reaction.
          - text:
              de: Wasserstoff verbrennt zu Wasser.
              en: Hydrogen burns to water.
            correct: true
            info:
              de: Aus Wasserstoff und Sauerstoff wird Wasser, ein neuer Stoff. Es ist eine chemische Reaktion.
              en: Hydrogen and oxygen become water, a new substance. It is a chemical reaction.
          - text:
              de: Eis schmilzt.
              en: Ice melts.
            correct: false
            info:
              de: Geschmolzenes Eis ist weiter Wasser. Es ändert sich nur der Zustand.
              en: Melted ice is still water. Only the state changes.
          - text:
              de: Wasser verdampft.
              en: Water evaporates.
            correct: false
            info:
              de: Wasserdampf ist weiter Wasser. Es ist nur eine Zustandsänderung.
              en: Water vapour is still water. It is only a change of state.
        explanation:
          de: Beim Schmelzen und Verdampfen bleibt es derselbe Stoff, nur der Zustand ändert sich. Beim Verbrennen entstehen neue Stoffe.
          en: When melting and evaporating the substance stays the same, only the state changes. When burning, new substances are formed.
        links: &a1
          - title:
              de: Chemische Reaktion (Wikipedia)
              en: Chemical reaction (Wikipedia, German)
            url: https://de.wikipedia.org/wiki/Chemische_Reaktion
      - type: single-choice
        id: kerzenwachs
        text:
          de: Kerzenwachs wird in einem Topf erwärmt und flüssig. Welche Aussage stimmt?
          en: Candle wax is warmed in a pot and becomes liquid. Which statement is right?
        options:
          - text:
              de: Es ist eine Zustandsänderung, das Wachs bleibt Wachs.
              en: It is a change of state; the wax stays wax.
            correct: true
            info:
              de: Beim Abkühlen wird es wieder fest. Der Stoff ist derselbe geblieben.
              en: When it cools it becomes solid again. The substance has stayed the same.
          - text:
              de: Es ist eine chemische Reaktion, weil das Wachs sich verändert.
              en: It is a chemical reaction because the wax changes.
            correct: false
            info:
              de: Verändert hat sich nur der Zustand. Es ist kein neuer Stoff entstanden.
              en: Only the state has changed. No new substance was formed.
          - text:
              de: Es ist eine chemische Reaktion, weil Wärme zugeführt wird.
              en: It is a chemical reaction because heat is supplied.
            correct: false
            info:
              de: Wärme allein zeigt keine Reaktion an. Entscheidend ist, ob ein neuer Stoff entsteht.
              en: Heat alone does not show a reaction. What counts is whether a new substance is formed.
        explanation:
          de: Beim Schmelzen bleibt das Wachs dasselbe, nur der Zustand wechselt.
          en: When melting, the wax stays the same; only the state changes.
        links: *a1
      - type: true-false
        id: zucker-braun
        text:
          de: Wird Zucker stark erhitzt, wird er braun und riecht nach Karamell. Das ist eine Zustandsänderung.
          en: When sugar is heated strongly, it turns brown and smells of caramel. That is a change of state.
        answer: false
        explanation:
          de: "Der braune Stoff hat andere Eigenschaften als Zucker: Farbe und Geruch sind neu, und er wird beim Abkühlen nicht wieder zu Zucker. Es ist eine chemische Reaktion."
          en: "The brown substance has different properties from sugar: colour and smell are new, and it does not turn back into sugar when it cools. It is a chemical reaction."
        links: *a1

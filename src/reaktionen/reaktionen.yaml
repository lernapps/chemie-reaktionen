# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Woran du eine Reaktion erkennst
  en: How to recognise a reaction
description:
  de: Farbe, Gas, Wärme oder Licht können auf eine chemische Reaktion hinweisen. Sicher ist nur ein neuer Stoff.
  en: Colour, gas, heat or light can hint at a chemical reaction. Only a new substance is certain.
competencies: [kennzeichen-chemischer-reaktionen]
blocks:
  - type: section
    id: warum
    title:
      de: Warum
      en: Why
    blocks:
      - type: text
        text:
          de: |
            Wenn Holz verbrennt, bleibt kein Holz übrig. Wenn Brausepulver im Wasser sprudelt, ist etwas passiert, das du nicht rückgängig machen kannst. In der Chemie nennt man das eine chemische Reaktion. Du siehst dem Stoff nicht an, dass er reagiert, aber du kannst es an Beobachtungen erkennen.
          en: |
            When wood burns, no wood is left. When effervescent powder fizzes in water, something has happened that you cannot undo. In chemistry this is called a chemical reaction. You cannot see inside the substance, but you can recognise a reaction from what you observe.
  - type: section
    id: regel
    title:
      de: Regel
      en: Rule
    blocks:
      - type: definition
        term:
          de: Chemische Reaktion
          en: Chemical reaction
        explanation:
          de: Bei einer chemischen Reaktion verwandeln sich Stoffe in andere Stoffe. Die neuen Stoffe haben andere Eigenschaften als die alten.
          en: In a chemical reaction substances turn into other substances. The new substances have different properties from the old ones.
      - type: text
        text:
          de: |
            Hinweise auf eine Reaktion sind zum Beispiel eine Farbänderung, ein Gas, das aufsteigt, Wärme oder Licht. Es sind nur Hinweise: Auch eine Heizung macht einen Stoff warm, und kochendes Wasser blubbert, ohne zu reagieren.
          en: |
            Hints of a reaction are for example a change of colour, a rising gas, heat or light. They are only hints: a radiator also warms a substance, and boiling water bubbles without reacting.
      - type: text
        text:
          de: |
            Sicher ist nur eins: Es entsteht ein neuer Stoff mit anderen Eigenschaften als vorher. Prüfe deshalb immer die Eigenschaften der Stoffe vorher und nachher, zum Beispiel Farbe, Geruch oder ob sie brennen.
          en: |
            Only one thing is certain: a new substance is formed whose properties differ from before. So always compare the properties of the substances before and after, for example colour, smell or whether they burn.
  - type: section
    id: beispiel
    title:
      de: Beispiel
      en: Example
    blocks:
      - type: example
        title:
          de: Magnesium verbrennt
          en: Magnesium burns
        blocks:
          - type: text
            text:
              de: |
                Ein silbriges Magnesiumband brennt mit hellem, weißem Licht. Danach bleibt ein weißes Pulver übrig. Du beobachtest Licht, Wärme und einen Stoff, der anders aussieht und sich anders verhält als das Metall vorher. Das neue weiße Pulver beweist die Reaktion.
              en: |
                A silvery magnesium ribbon burns with a bright white light. Afterwards a white powder is left. You observe light, heat and a substance that looks and behaves differently from the metal before. The new white powder proves the reaction.
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: multiple-choice
        id: beobachtung-hinweis
        text:
          de: Welche Beobachtungen können auf eine chemische Reaktion hinweisen?
          en: Which observations can hint at a chemical reaction?
        options:
          - text:
              de: Ein Feststoff färbt sich beim Erhitzen schwarz.
              en: A solid turns black when heated.
            correct: true
            info:
              de: Eine neue Farbe kann ein neuer Stoff sein. Es ist ein Hinweis, aber noch kein Beweis.
              en: A new colour can mean a new substance. It is a hint, but not proof yet.
          - text:
              de: Beim Zusammengeben zweier Flüssigkeiten steigen Gasblasen auf.
              en: Gas bubbles rise when two liquids are mixed.
            correct: true
            info:
              de: Ein neues Gas kann bei einer Reaktion entstehen. Ein Hinweis auf einen neuen Stoff.
              en: A new gas can be formed in a reaction. A hint at a new substance.
          - text:
              de: Ein Metallstück glüht hell auf und gibt Wärme ab.
              en: A piece of metal glows brightly and gives off heat.
            correct: true
            info:
              de: Licht und Wärme zeigen oft eine Reaktion an, zum Beispiel beim Verbrennen.
              en: Light and heat often show a reaction, for example when burning.
          - text:
              de: Ein Stück Eis liegt auf dem Tisch und wird kleiner.
              en: A piece of ice lies on the table and gets smaller.
            correct: false
            info:
              de: Das Eis schmilzt. Es bleibt Wasser, es entsteht kein neuer Stoff.
              en: The ice melts. It stays water; no new substance is formed.
        explanation:
          de: Farbe, Gas, Licht und Wärme sind Hinweise. Beim Schmelzen von Eis bleibt es derselbe Stoff.
          en: Colour, gas, light and heat are hints. When ice melts, it stays the same substance.
        links: &a1
          - title:
              de: Chemische Reaktion (Wikipedia)
              en: Chemical reaction (Wikipedia, German)
            url: https://de.wikipedia.org/wiki/Chemische_Reaktion
      - type: true-false
        id: gas-beweis
        text:
          de: Wenn beim Erhitzen von Wasser Blasen aufsteigen, ist das der Beweis für eine chemische Reaktion.
          en: When bubbles rise while water is heated, that proves a chemical reaction.
        answer: false
        explanation:
          de: Beim Kochen entsteht Wasserdampf. Das ist weiter Wasser, nur gasförmig. Ein aufsteigendes Gas ist nur ein Hinweis, kein Beweis.
          en: Boiling forms water vapour. That is still water, just as a gas. A rising gas is only a hint, not proof.
        links: *a1
      - type: single-choice
        id: sicheres-zeichen
        text:
          de: Woran erkennst du sicher eine chemische Reaktion?
          en: How can you be sure that a chemical reaction has taken place?
        options:
          - text:
              de: Es entsteht ein neuer Stoff.
              en: A new substance is formed.
            correct: true
            info:
              de: "Das ist das sichere Merkmal: Die Stoffe haben sich in andere Stoffe verwandelt."
              en: "That is the certain sign: the substances have turned into other substances."
          - text:
              de: Der Stoff wird wärmer.
              en: The substance gets warmer.
            correct: false
            info:
              de: Ein Stoff kann auch wärmer werden, ohne dass er reagiert, zum Beispiel auf einer Heizung.
              en: A substance can also get warmer without reacting, for example on a radiator.
          - text:
              de: Der Stoff wechselt den Aggregatzustand.
              en: The substance changes its state of matter.
            correct: false
            info:
              de: Das ist eine Zustandsänderung. Der Stoff bleibt dabei derselbe.
              en: That is a change of state. The substance stays the same.
        explanation:
          de: Nur ein neuer Stoff zeigt sicher eine Reaktion an. Wärme oder ein Zustandswechsel reichen nicht.
          en: Only a new substance shows a reaction for sure. Heat or a change of state is not enough.
        links: *a1

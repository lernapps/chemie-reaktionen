format: 2
# The strand of the learning map the app stays in; each page names its competencies (ids of map/chemie.yaml in
# lernapps/apps). Recap pages name the competency they repeat instead.
strand: chemie/chemische-reaktion
title:
  de: Chemie – Chemische Reaktionen
  en: Chemistry – chemical reactions
intro:
  de: |
    Wann ist etwas eine chemische Reaktion, und wie schreibst du sie auf? Du unterscheidest Reaktionen von Zustandsänderungen und stellst einfache Reaktionsgleichungen auf. Vorher wiederholst du kurz, was du dafür brauchst. Auf jeder Seite übst du selbst.
    Für die unteren Klassenstufen (Klasse 7 und 8).
  en: |
    When is something a chemical reaction, and how do you write it down? You tell reactions from changes of state and write simple reaction equations. Before that you briefly recap what you need for it. You practise on every page.
    For the lower grades (grades 7 and 8).
languages:
  - de
  - en
chapters:
  - vorwissen
  - reaktionen
